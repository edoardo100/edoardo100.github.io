<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About - Edoardo's webpage</title>

  <link href="custom.css" rel="stylesheet">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-primary">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <img src="my_logo_primary.png" alt="My Logo" height="40">
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link active" href="about.html">About</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="research.html">Research</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="teaching.html">Teaching</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="blog.html">Blog</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- About Me Section -->
  <section id="about" class="py-5" style="background-color: var(--bg-color);">
    <div class="container">
      <h2 class="mb-4 text-center">About Me</h2>

      <div class="container py-5">
        <!-- All of the blocks below come from data/cv.json -->
        <h2>Current Position</h2>
        <ul class="list-group mt-3" data-cv="positions"></ul>

        <h2 class="mt-4">Education</h2>
        <ul class="list-group mt-3" data-cv="education"></ul>

        <h2 class="mt-4">Technical Skills</h2>
        <p class="mt-3" data-cv="skills"></p>

        <h2 class="mt-4">Languages</h2>
        <ul class="list-group mt-3" data-cv="languages"></ul>
      </div>

      <section class="py-5">
        <div class="container">
          <!-- Top row: two pictures -->
          <div class="row row-cols-1 row-cols-md-2 g-4 justify-content-center">
            <div class="col text-center">
              <figure class="figure">
                <img src="me_board.jpg" alt="How to recognize me" class="img-fluid rounded shadow mb-3">
                <figcaption class="figure-caption text-muted mb-4">How to recognize me.</figcaption>

                <!-- Smaller graduation picture below -->
                <img src="graduation.jpg" alt="Graduation day" class="img-fluid rounded shadow" style="max-width: 75%;">
                <figcaption class="figure-caption text-muted mt-2">
                  Another picture of mine on my graduation day.
                </figcaption>
              </figure>
            </div>

            <div class="col text-center">
              <figure class="figure">
                <img src="me_1.jpeg" alt="Sometimes I happen to work" class="img-fluid rounded shadow">
                <figcaption class="figure-caption text-muted mt-2">Sometimes I happen to work.</figcaption>
              </figure>
            </div>
          </div>
        </div>
      </section>

      <div class="text-center">
        <a class="btn btn-primary my-4" href="https://www.youtube.com/watch?v=1MVw4dMq8Bk" target="_blank" style="background-color: var(--primary-color); border-color: var(--primary-color);">Click here to see me in action</a>
      </div>
    </div>
  </section>

  <!-- Bootstrap JavaScript and Popper.js -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/site.js"></script>
</body>
</html>
